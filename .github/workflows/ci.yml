name: Verify the circle
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  encrypted-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            encrypted-client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: encrypted-client
      - run: npm run check && npm test && npm run build
        working-directory: encrypted-client
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: encrypted-client
      - name: Browser photo and durable retry checks
        run: npx --no-install playwright test --config playwright.config.ts shared-photo.spec.ts outbox.spec.ts
        working-directory: encrypted-client
      - name: Verify actual legacy HTTP export migration
        run: npx --no-install tsx --test tests/legacy-import.integration.ts
        working-directory: encrypted-client
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: encrypted-client
      - run: python3 -m unittest discover -s encrypted-host -p 'test_*.py'
  encrypted-browser:
    needs: encrypted-client
    # Official standard ARM64 runner; matches the reviewed encrypted-host image digests.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite:
          [
            journey,
            concurrent-import,
            migration,
            social-lifecycle,
            local-cleanup,
            large-import,
            identity-recovery,
            import-recovery,
            sharing-hardening,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            encrypted-client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: encrypted-client
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: encrypted-client
      - name: Qualify one isolated encrypted browser suite
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: node scripts/encrypted-browser-ci.mjs --suite "$BROWSER_SUITE" --work "$RUNNER_TEMP/clean-bookface-$BROWSER_SUITE"
      - name: Remove this job's disposable host even after failure
        if: always()
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: node scripts/encrypted-browser-ci.mjs --cleanup --work "$RUNNER_TEMP/clean-bookface-$BROWSER_SUITE"
      # No artifact upload: generated credentials, recovery kits and error contexts stay private.
      # Federation and restored-standby journeys retain their separate external qualification.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the reviewed backup binary
        run: |
          docker create --name bookface-restic-tool restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
          docker cp bookface-restic-tool:/usr/bin/restic /tmp/clean-bookface-restic
          sudo install -m 755 /tmp/clean-bookface-restic /usr/local/bin/restic
          docker rm bookface-restic-tool
      - run: npm run check:repository
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t clean-bookface:test .
      - run: node scripts/container-smoke.mjs --image clean-bookface:test
      - run: node scripts/provider-smoke.mjs --image clean-bookface:test
